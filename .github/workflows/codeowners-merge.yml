name: 'Maintenance: Codeowners Detection and Mention'
on:
  pull_request_target: { types: [opened, reopened, ready_for_review] }
  issue_comment: { types: [created] }
  pull_request_review: { types: [submitted] }

jobs:
  codeowners-merge:
    if: "github.repository == 'SchemaStore/schemastore' && github.event.pull_request.draft == false"
    runs-on: ubuntu-latest
    permissions: 'write-all'
    steps:
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
      - name: 'Run Codeowners check'
        uses: 'OSS-Docs-Tools/code-owner-self-merge@35e0f55671d1cebd7c0a53e199cb3a3a03678c2b' # 1.6.8
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        with:
          merge_method: 'squash'
          ownerNoPings: '["@hyperupcall"]'
